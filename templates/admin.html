
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İlan Yönetimi</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <header class="header">
        <div class="container">
            <h1>Yönetim Paneli</h1>

            <form action="{{ url_for('logout') }}" method="POST">
                <button type="submit">Çıkış Yap</button>
            </form>
        </div>
    </header>

    <main class="container">
        <h2>Yeni İlan Ekle</h2>

        {% with messages = get_flashed_messages() %}
            {% for message in messages %}
                <p class="message">{{ message }}</p>
            {% endfor %}
        {% endwith %}

        <form action="{{ url_for('add_listing') }}" method="POST" enctype="multipart/form-data" class="admin-form">

            <label>İlan Başlığı</label>
            <input type="text" name="title" required>

            <label>Fiyat (TL)</label>
            <input type="text" name="price" required>

            <label>Açıklama</label>
            <textarea name="description" required></textarea>

            <label>Telefon Numarası</label>
            <input type="text" name="phone" required>

            <label>İlan Fotoğrafı</label>
            <input type="file" name="photo" accept=".jpg,.jpeg,.png,.webp" required>

            <button type="submit">İlanı Yayınla</button>
        </form>

        <h2>Mevcut İlanlar</h2>

        {% for listing in listings %}
            <div class="admin-listing">
                <strong>{{ listing['title'] }}</strong>
                <span>{{ listing['price'] }} TL</span>

                <form action="{{ url_for('delete_listing', listing_id=listing['id']) }}" method="POST">
                    <button type="submit">Sil</button>
                </form>
            </div>
        {% else %}
            <p>Henüz ilan eklenmemiş.</p>
        {% endfor %}
    </main>

</body>
</html>
